<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fixkosten-Checkliste</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fixkosten">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2563eb">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f9;--card:#fff;--text:#1d232b;--muted:#6b7480;--line:#e3e6ea;--accent:#2563eb;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--field:#e8f0fe}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12151a;--card:#1b2027;--text:#e8ebef;--muted:#98a1ad;--line:#2a313a;--accent:#60a5fa;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--field:#2a3547}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12151a;--card:#1b2027;--text:#e8ebef;--muted:#98a1ad;--line:#2a313a;--accent:#60a5fa;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--field:#2a3547}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.nav h1{font-size:1.25rem;margin:0}
.nav button{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:10px;width:40px;height:40px;font-size:1.1rem}
.sum,.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card{margin-top:16px}
.card h2{font-size:1rem;margin:0 0 8px}
.sum .row{display:flex;justify-content:space-between;gap:8px;text-align:center}
.sum small,.card small{display:block;color:var(--muted);font-size:.78rem}
.sum b{font-size:1.1rem}
.bar{height:8px;background:var(--line);border-radius:99px;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.done{color:var(--ok);font-weight:600;text-align:center;margin-top:10px}
.flt{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:.95rem}
.flt input{width:22px;height:22px;accent-color:var(--accent)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
li input[type=checkbox]{width:26px;height:26px;accent-color:var(--ok);flex:none}
li .m{flex:1;min-width:0}
li .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li .d{font-size:.82rem;color:var(--muted)}
li .d.bad{color:var(--bad)}li .d.warn{color:var(--warn)}li .d.ok{color:var(--ok)}
li .a{font-variant-numeric:tabular-nums;font-weight:600}
li.paid{opacity:.7}
li.paid .n,li.paid .a{text-decoration:line-through;color:var(--muted)}
li .x,li .e{background:none;border:0;color:var(--muted);font-size:1.1rem;padding:6px}
li .x.sure{color:var(--bad);font-size:.8rem;font-weight:600}
.add{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.add h2{grid-column:1/-1;font-size:1rem;margin:0}
.add label{font-size:.8rem;color:var(--muted);display:block;margin-bottom:3px}
.add input,.add select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--text);font-size:16px;min-height:44px}
.add .full{grid-column:1/-1}
.add .chk{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:.95rem;color:var(--text);margin:0}
.add .chk input{width:22px;height:22px;min-height:0;accent-color:var(--accent);flex:none}
.add button{grid-column:1/-1;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:1rem;font-weight:600}
.add .cancel{background:var(--line);color:var(--text)}
.add button[hidden]{display:none}
.add .sw{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap}
.add .sw button{grid-column:auto;width:36px;height:36px;padding:0;border-radius:50%;border:2px solid var(--line);font-size:.9rem;font-weight:400;color:var(--muted)}
.add .sw button.on{border-color:var(--text);box-shadow:inset 0 0 0 3px var(--card)}
.card button.sec{padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font-size:.95rem;margin:0 8px 8px 0}
details summary{font-weight:600;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:10px;font-variant-numeric:tabular-nums;font-size:.92rem}
td,th{padding:8px 4px;text-align:right;border-bottom:1px solid var(--line)}
td:first-child,th:first-child{text-align:left}
tr.m{cursor:pointer}tr.cur td{font-weight:700}
tfoot td{font-weight:700;border-bottom:0}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
</style>
</head>
<body>
<main>
  <div class="nav">
    <button id="prev" aria-label="Voriger Monat">‹</button>
    <h1 id="title"></h1>
    <button id="next" aria-label="Nächster Monat">›</button>
  </div>
  <div class="sum">
    <div class="row">
      <div><small>Gesamt</small><b id="tot"></b></div>
      <div><small>Offen</small><b id="open"></b></div>
      <div><small>Bezahlt</small><b id="paid"></b></div>
    </div>
    <div class="bar"><i id="fill"></i></div>
    <div class="done" id="done" hidden>✓ Alles bezahlt</div>
  </div>
  <label class="flt"><input id="onlyopen" type="checkbox"> Nur offene anzeigen</label>
  <ul id="list"></ul>
  <div class="add">
    <h2 id="ft">Neue Fixkosten</h2>
    <div class="full"><label for="nm">Name</label><input id="nm" placeholder="z. B. Miete" maxlength="60"></div>
    <div><label for="am">Betrag in €</label><input id="am" type="number" inputmode="decimal" step="0.01" min="0"></div>
    <div><label for="iv">Rhythmus</label>
      <select id="iv"><option value="1">monatlich</option><option value="3">vierteljährlich</option><option value="6">halbjährlich</option><option value="12">jährlich</option></select>
    </div>
    <div class="full"><label for="dt">Nächste Fälligkeit (bei monatlich zählt der Tag)</label><input id="dt" type="date"></div>
    <div class="full"><label for="en">Läuft bis, letzter Monat (optional, z. B. bei Kündigung)</label><input id="en" type="month"></div>
    <div class="full" id="ovw" hidden><label for="ao" id="ovl"></label><input id="ao" type="number" inputmode="decimal" step="0.01" min="0" placeholder="leer = normaler Betrag"></div>
    <div class="full"><label>Farbe des Eintrags</label></div>
    <div class="sw" id="sw"></div>
    <label class="chk"><input id="au" type="checkbox" checked> Am Fälligkeitsdatum automatisch abhaken</label>
    <button id="addBtn">Hinzufügen</button>
    <button id="cancelBtn" class="cancel" hidden>Abbrechen</button>
  </div>
  <div class="card">
    <details><summary>Jahresübersicht</summary><div id="yrbody"></div></details>
  </div>
  <div class="card">
    <h2>Sicherung</h2>
    <button class="sec" id="exp">Sicherung exportieren</button><button class="sec" id="imp">Sicherung laden</button>
    <input id="file" type="file" accept=".json,application/json" hidden>
    <small id="lb"></small>
  </div>
</main>
<script>
var KEY='fixkosten-v1';
var state={items:[],paid:{},ov:{},openOnly:false};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&p.items)state=Object.assign(state,p);}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
var now=new Date(),cy=now.getFullYear(),cm=now.getMonth(),sure=null;
var editId=null,editDay=null,editKey=null,selCol='';
var COLS=['#ef4444','#f59e0b','#22c55e','#3b82f6','#a855f7','#ec4899'];
var $=function(i){return document.getElementById(i)};
var eur=function(v){return v.toLocaleString('de-DE',{style:'currency',currency:'EUR'})};
var IVN={1:'monatlich',3:'vierteljährlich',6:'halbjährlich',12:'jährlich'};
function mkey(){return cy+'-'+(cm+1)}
function pad(n){return (n<10?'0':'')+n}
function mname(y,m){return new Date(y,m,1).toLocaleDateString('de-DE',{month:'long',year:'numeric'})}
function isDue(it,idx){
  if(it.end!=null&&idx>it.end)return false;
  if(it.sm==null)return true;
  if(idx<it.sm)return false;
  return (idx-it.sm)%(it.iv||1)===0;
}
function calc(y,m){
  var key=y+'-'+(m+1),paid=state.paid[key]||{},ov=state.ov[key]||{};
  var dim=new Date(y,m+1,0).getDate(),idx=y*12+m,ni=now.getFullYear()*12+now.getMonth();
  var isNow=idx===ni,isPast=idx<ni,today=now.getDate();
  return state.items.filter(function(it){return isDue(it,idx)}).map(function(it){
    var d=Math.min(it.day,dim),reached=isPast||(isNow&&d<=today),man=paid[it.id];
    var auto=man===undefined&&!!it.auto&&reached,has=ov[it.id]!==undefined;
    return {it:it,d:d,amt:has?ov[it.id]:it.amount,ovr:has,auto:auto,paid:man===undefined?auto:man,isNow:isNow,today:today};
  }).sort(function(a,b){return a.d-b.d});
}
function render(){
  var list=calc(cy,cm),ul=$('list'),tot=0,pd=0,shown=0;
  ul.innerHTML='';$('title').textContent=mname(cy,cm);
  list.forEach(function(c){tot+=c.amt;if(c.paid)pd+=c.amt;});
  list.forEach(function(c){
    if(state.openOnly&&c.paid)return;
    shown++;
    var it=c.it,info='fällig am '+c.d+'.',cls='';
    if(c.paid){info=c.auto?'automatisch abgehakt am '+c.d+'.':'bezahlt';cls='ok';}
    else if(c.isNow&&c.d<c.today){info='überfällig seit '+c.d+'.';cls='bad';}
    else if(c.isNow&&c.d-c.today<=3){info=(c.d===c.today?'heute fällig':'fällig am '+c.d+'. (bald)');cls='warn';}
    if((it.iv||1)>1)info+=' · '+IVN[it.iv];
    if(c.ovr)info+=' · abweichender Betrag';
    if(it.end!=null&&cy*12+cm===it.end)info+=' · letzte Zahlung';
    var li=document.createElement('li');if(c.paid)li.className='paid';
    if(it.col){li.style.background=it.col+'2e';li.style.borderLeft='6px solid '+it.col;}
    var cb=document.createElement('input');cb.type='checkbox';cb.checked=c.paid;
    cb.onchange=function(){var k=mkey();state.paid[k]=state.paid[k]||{};state.paid[k][it.id]=cb.checked;save();render();};
    var m=document.createElement('div');m.className='m';
    var n=document.createElement('div');n.className='n';n.textContent=it.name;
    var dd=document.createElement('div');dd.className='d '+cls;dd.textContent=info;
    m.appendChild(n);m.appendChild(dd);
    var a=document.createElement('div');a.className='a';a.textContent=eur(c.amt);
    var e=document.createElement('button');e.className='e';e.textContent='✎';e.setAttribute('aria-label','Bearbeiten');e.onclick=function(){startEdit(it)};
    var x=document.createElement('button');x.className='x'+(sure===it.id?' sure':'');x.textContent=sure===it.id?'Löschen?':'✕';
    x.onclick=function(){
      if(sure===it.id){state.items=state.items.filter(function(i){return i.id!==it.id});sure=null;if(editId===it.id)resetForm();save();}
      else sure=it.id;
      render();
    };
    li.appendChild(cb);li.appendChild(m);li.appendChild(a);li.appendChild(e);li.appendChild(x);ul.appendChild(li);
  });
  if(!shown)ul.innerHTML='<div class="empty">'+(!state.items.length?'Noch keine Fixkosten eingetragen.':!list.length?'In diesem Monat ist nichts fällig.':'Alles erledigt, nichts mehr offen.')+'</div>';
  $('tot').textContent=eur(tot);$('open').textContent=eur(tot-pd);$('paid').textContent=eur(pd);
  $('fill').style.width=(tot?pd/tot*100:0)+'%';
  $('done').hidden=!(list.length&&pd===tot);
  $('onlyopen').checked=!!state.openOnly;
  $('lb').textContent=state.lastBackup?'Letzte Sicherung: '+new Date(state.lastBackup).toLocaleDateString('de-DE'):'Noch keine Sicherung erstellt.';
  renderYear();
}
function renderYear(){
  var h='<table><thead><tr><th>'+cy+'</th><th>Gesamt</th><th>Offen</th></tr></thead><tbody>',yt=0,yo=0;
  for(var mo=0;mo<12;mo++){
    var t=0,o=0;
    calc(cy,mo).forEach(function(c){t+=c.amt;if(!c.paid)o+=c.amt;});
    yt+=t;yo+=o;
    h+='<tr class="m'+(mo===cm?' cur':'')+'" data-m="'+mo+'"><td>'+new Date(cy,mo,1).toLocaleDateString('de-DE',{month:'long'})+'</td><td>'+eur(t)+'</td><td>'+eur(o)+'</td></tr>';
  }
  h+='</tbody><tfoot><tr><td>Jahr gesamt</td><td>'+eur(yt)+'</td><td>'+eur(yo)+'</td></tr><tr><td>Ø pro Monat</td><td>'+eur(yt/12)+'</td><td></td></tr></tfoot></table>';
  var b=$('yrbody');b.innerHTML=h;
  Array.prototype.forEach.call(b.querySelectorAll('tr.m'),function(r){r.onclick=function(){cm=parseInt(r.getAttribute('data-m'),10);sure=null;render();window.scrollTo(0,0);};});
}
function drawSw(){
  var box=$('sw');box.innerHTML='';
  [''].concat(COLS).forEach(function(c){
    var b=document.createElement('button');b.type='button';
    b.className=(c===selCol)?'on':'';
    b.style.background=c||'transparent';
    b.textContent=c?'':'–';
    b.setAttribute('aria-label',c?'Farbe '+c:'Keine Farbe');
    b.onclick=function(){selCol=c;drawSw();};
    box.appendChild(b);
  });
}
function startEdit(it){
  editId=it.id;editDay=it.day;editKey=mkey();
  var y=it.sm==null?cy:Math.floor(it.sm/12),mo=it.sm==null?cm:it.sm%12;
  var dim=new Date(y,mo+1,0).getDate();
  $('nm').value=it.name;$('am').value=it.amount;$('iv').value=String(it.iv||1);
  $('dt').value=y+'-'+pad(mo+1)+'-'+pad(Math.min(it.day,dim));
  $('en').value=it.end!=null?Math.floor(it.end/12)+'-'+pad(it.end%12+1):'';
  var o=(state.ov[editKey]||{})[it.id];
  $('ao').value=o!==undefined?o:'';
  $('ovl').textContent='Betrag nur für '+mname(cy,cm)+' (optional)';$('ovw').hidden=false;
  $('au').checked=!!it.auto;selCol=it.col||'';drawSw();
  $('ft').textContent='Fixkosten bearbeiten';$('addBtn').textContent='Änderung speichern';$('cancelBtn').hidden=false;
  $('nm').scrollIntoView({behavior:'smooth',block:'center'});
}
function resetForm(){
  editId=null;editDay=null;editKey=null;
  $('nm').value='';$('am').value='';$('dt').value='';$('en').value='';$('ao').value='';$('iv').value='1';
  $('ovw').hidden=true;$('au').checked=true;selCol='';drawSw();
  $('ft').textContent='Neue Fixkosten';$('addBtn').textContent='Hinzufügen';$('cancelBtn').hidden=true;
}
$('cancelBtn').onclick=resetForm;
$('addBtn').onclick=function(){
  var name=$('nm').value.trim(),am=parseFloat(String($('am').value).replace(',','.')),dv=$('dt').value;
  if(!name||isNaN(am)||!/^\d{4}-\d{2}-\d{2}$/.test(dv)){alert('Bitte Name, Betrag und Fälligkeitsdatum eingeben.');return;}
  var pr=dv.split('-').map(Number),day=pr[2],sm=pr[0]*12+(pr[1]-1),em=null;
  if(/^\d{4}-\d{2}$/.test($('en').value)){var ep=$('en').value.split('-').map(Number);em=ep[0]*12+(ep[1]-1);}
  if(em!==null&&em<sm){alert('Das Enddatum liegt vor der ersten Fälligkeit.');return;}
  if(editId&&editDay){var dn=new Date(pr[0],pr[1],0).getDate();if(editDay>dn&&day===dn)day=editDay;}
  var obj={name:name,amount:am,day:day,iv:parseInt($('iv').value,10),sm:sm,end:em,auto:$('au').checked,col:selCol};
  if(editId){
    state.items.forEach(function(i){if(i.id===editId)Object.assign(i,obj);});
    var o=parseFloat(String($('ao').value).replace(',','.'));
    state.ov[editKey]=state.ov[editKey]||{};
    if(!isNaN(o))state.ov[editKey][editId]=o;else delete state.ov[editKey][editId];
  }else{
    obj.id=Date.now().toString(36)+Math.random().toString(36).slice(2,5);state.items.push(obj);
    cy=pr[0];cm=pr[1]-1;
  }
  save();resetForm();render();
};
$('prev').onclick=function(){cm--;if(cm<0){cm=11;cy--;}sure=null;render();};
$('next').onclick=function(){cm++;if(cm>11){cm=0;cy++;}sure=null;render();};
$('onlyopen').onchange=function(){state.openOnly=this.checked;save();render();};
function doExport(){
  var name='fixkosten-sicherung-'+now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate())+'.json';
  function mark(){state.lastBackup=new Date().toISOString();save();render();}
  var json=JSON.stringify(state,null,1),f=null;
  try{f=new File([json],name,{type:'application/json'});}catch(e){}
  if(f&&navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).then(mark).catch(function(){});return;}
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=name;
  document.body.appendChild(a);a.click();a.remove();mark();
}
$('exp').onclick=doExport;
$('imp').onclick=function(){$('file').click();};
$('file').onchange=function(){
  var f=this.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var o=JSON.parse(r.result);
      if(!o||!Array.isArray(o.items)||!o.items.every(function(i){return i&&i.id&&typeof i.name==='string'&&typeof i.amount==='number'}))throw 0;
      if(confirm('Aktuelle Daten durch die Sicherung ersetzen? ('+o.items.length+' Einträge)')){
        state=Object.assign({items:[],paid:{},ov:{},openOnly:false},o);save();resetForm();render();alert('Sicherung geladen.');
      }
    }catch(e){alert('Diese Datei ist keine gültige Sicherung.');}
    $('file').value='';
  };
  r.readAsText(f);
};
drawSw();render();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
</body>
</html>
